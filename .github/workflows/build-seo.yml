name: Build SEO pages
# Runs when the content or a page changes. Writes the SEO tags, the crawlable text, the Arabic pages
# (index-ar.html ...), sitemap.xml and robots.txt, and commits them back to the same branch.
# Needs: Settings > Actions > General > Workflow permissions > "Read and write permissions".
on:
  push:
    paths:
      - 'app-data.json'
      - 'app-data.ar.json'
      - 'index.html'
      - 'about.html'
      - 'patents.html'
      - 'trademarks.html'
      - 'translation.html'
      - 'lang.js'
      - 'pages-i18n.js'
      - 'scripts/build-seo.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-seo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/validate.js
      - run: node scripts/build-seo.js
      - name: Commit generated files
        run: |
          git config user.name "khip-seo-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; else git commit -m "Build SEO pages [skip ci]" && git pull --rebase origin "$GITHUB_REF_NAME" && git push; fi
