<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHIP - Intellectual Property & Legal Solutions</title>
<meta name="description" content="KHIP (Khaled Hamada Intellectual Property): patents, trademarks and translation across the Middle East.">
<meta name="theme-color" content="#1d4ed8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/7.2.3/css/flag-icons.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{display:['"Cormorant Garamond"','Georgia','serif'],sans:['Jost','system-ui','sans-serif']},colors:{ink:'#1b2433',gold:'#a8844f',brand:{50:'#eff6ff',100:'#dbeafe',600:'#1d4ed8',700:'#1e40af'}}}}}</script>
<style type="text/tailwindcss">
.wrap{@apply max-w-6xl mx-auto px-5 md:px-8}
.band{@apply py-14 md:py-20}
.h2{@apply font-display text-3xl md:text-[2.6rem] leading-tight font-medium text-ink}
.rule{@apply block w-12 h-px bg-gold mt-3 mb-7}
.card{@apply bg-white rounded-2xl border border-stone-200/80 shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-xl}
.slider{@apply flex gap-4 overflow-x-auto snap-x pb-3;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.slider>*{@apply snap-start flex-shrink-0}
</style>
<style>
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:#f7f6f3}
:focus-visible{outline:2px solid #1d4ed8;outline-offset:2px}
.slide{opacity:0;transition:opacity 1s ease}.slide.on{opacity:1}
.slide.on img{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.rv{opacity:0;transform:translateY(20px);transition:opacity .9s ease,transform .9s cubic-bezier(.16,1,.3,1)}.rv.in{opacity:1;transform:none}
.fu{opacity:0;transform:translateY(28px);transition:opacity .9s ease var(--d,0s),transform .9s cubic-bezier(.16,1,.3,1) var(--d,0s)}.fu.in{opacity:1;transform:none}
.sheet{transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .4s ease}.sheet.closed{opacity:0;transform:translateY(32px)}
</style>
</head>
<body class="font-sans font-light text-stone-700 antialiased">
<div id="app-top"></div>
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-xl border-b border-stone-200">
  <div class="wrap py-3 flex items-center justify-between">
    <div class="flex items-center gap-3"><span class="font-display text-2xl font-semibold text-ink tracking-wide">KHIP <span class="mx-1.5 font-light text-stone-400">|</span><span class="font-medium text-stone-600">Intellectual Properties</span></span></div>
    <nav class="hidden md:flex gap-8 text-sm text-stone-600" aria-label="Main">
      <a href="#about" class="hover:text-brand-600 transition">About</a><a href="#jurisdictions" class="hover:text-brand-600 transition">Countries</a><a href="#services" class="hover:text-brand-600 transition">Services</a><a href="#news" class="hover:text-brand-600 transition">News</a><a href="#team" class="hover:text-brand-600 transition">Team</a>
    </nav>
    <div class="flex gap-2" id="socials"></div>
  </div>
</header>

<main>
  <div id="error" class="hidden wrap pt-4"><div class="p-4 rounded-2xl bg-red-50 border border-red-200 text-sm text-red-800" role="alert">We couldn't load the latest content. <button data-act="retry" class="ml-2 font-medium underline">Try again</button></div></div>

  <section class="wrap pt-5 md:pt-8"><div id="carousel" class="relative h-60 sm:h-80 lg:h-[27rem] rounded-3xl overflow-hidden shadow-xl bg-ink" aria-roledescription="carousel"></div></section>

  <section id="about" class="band"><div class="wrap grid md:grid-cols-[1fr_1.6fr] gap-6 md:gap-16 items-start">
    <div class="fu"><h2 class="h2">About KHIP</h2><span class="rule"></span></div>
    <div class="fu" style="--d:.15s"><p id="about-text" class="text-base md:text-lg leading-relaxed"></p>
</div>
  </div>
  <div class="wrap mt-10 text-center fu" style="--d:.3s"><a href="about.html" class="inline-flex items-center gap-2 text-sm border border-ink/30 hover:bg-ink hover:text-white px-9 py-2.5 rounded-full transition">More <i class="ph-light ph-arrow-right"></i></a></div></section>

  <section id="jurisdictions" class="band bg-white hidden"><div class="wrap">
    <div class="flex items-end justify-between gap-4"><div><h2 class="h2">Jurisdictions</h2><span class="rule"></span></div><span id="jur-count" class="text-sm text-stone-500 mb-9"></span></div>
    <input id="jur-search" type="search" placeholder="Search countries" aria-label="Search countries" class="w-full md:w-72 mb-4 px-4 py-2.5 text-sm rounded-full border border-stone-300 bg-stone-50">
    <div id="jur-chips" class="relative flex gap-2.5 overflow-x-auto no-scrollbar pb-3"></div>
    <div id="jur-card" class="mt-2 rounded-3xl bg-stone-50 border border-stone-200 p-6 md:p-9"></div>
  </div></section>

  <section id="services" class="band hidden"><div class="wrap">
    <div class="fu"><h2 class="h2">Practice areas</h2><span class="rule"></span></div>
    <div id="services-list" class="grid gap-4 md:grid-cols-3"></div>
  </div></section>

  <!-- Products / search reports: hidden for now. Set SHOW_PRODUCTS=true in the script and add the section back to enable. -->

  <section id="news" class="band bg-white hidden"><div class="wrap">
    <div class="flex items-end justify-between gap-4"><div><h2 class="h2">What's new</h2><span class="rule"></span></div><span id="news-count" class="text-sm text-stone-500 mb-9"></span></div>
    <div id="news-list" class="slider"></div>
  </div></section>

  <section id="team" class="band hidden"><div class="wrap">
    <h2 class="h2">Our team</h2><span class="rule"></span>
    <div id="team-list" class="slider"></div>
  </div></section>

  <section id="testimonials" class="band bg-white hidden"><div class="wrap">
    <h2 class="h2 text-center">Client endorsements</h2><span class="rule mx-auto"></span>
    <div id="testimonials-list" class="grid max-w-3xl mx-auto"></div>
    <div id="t-dots" class="flex justify-center gap-2 mt-8"></div>
  </div></section>

</main>

<div id="modal" class="fixed inset-0 bg-ink/70 backdrop-blur-sm z-50 flex items-end md:items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500" data-act="close" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div id="sheet" class="sheet closed relative bg-white w-full max-w-md md:max-w-2xl rounded-t-3xl md:rounded-3xl overflow-hidden" onclick="event.stopPropagation()">
    <button data-act="close" aria-label="Close" class="absolute top-3 right-3 z-10 w-11 h-11 rounded-full bg-stone-100 hover:bg-stone-200 active:scale-95 flex items-center justify-center transition touch-manipulation"><i class="ph-light ph-x text-xl"></i></button>
    <div id="m-scroll" class="max-h-[88dvh] overflow-y-auto overscroll-contain p-6 md:p-9 pb-10"><div id="m-body" class="space-y-4"></div></div>
  </div>
</div>

<script src="footer.js"></script>
<script>
const SHOW_PRODUCTS=false; // products / search reports hidden for now
const DATA_URL="./app-data.json", CACHE="khip-data-v3";
const CODES={egypt:'eg',uae:'ae','united arab emirates':'ae','saudi arabia':'sa',jordan:'jo',kuwait:'kw',qatar:'qa',bahrain:'bh',oman:'om',morocco:'ma',tunisia:'tn',algeria:'dz',libya:'ly',lebanon:'lb',iraq:'iq',syria:'sy',yemen:'ye',sudan:'sd',palestine:'ps',turkey:'tr'};
const FALLBACK_IMG="https://placehold.co/600x400/e7e5e4/78716c?text=KHIP";
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Images: a bare file name such as "logo.jpg" is looked up in ./assets/
const img=u=>!u?FALLBACK_IMG:esc(/^(https?:\/\/|\.\/|\/|data:image)/.test(u)?u:'./assets/'+u);
const flag=j=>{const c=String(j.code||CODES[(j.country||'').toLowerCase()]||'').toLowerCase();return /^[a-z]{2}$/.test(c)?`<span class="fi fi-${c} rounded-sm shadow-sm" role="img" aria-label="${esc(j.country)} flag"></span>`:'<i class="ph-light ph-globe-hemisphere-west text-brand-600"></i>'};
const ICONS=[[/patent/i,'ph-lightbulb'],[/trade\s?mark/i,'ph-seal-check'],[/transl/i,'ph-translate'],[/design/i,'ph-pencil-ruler'],[/copyright/i,'ph-copyright'],[/search/i,'ph-magnifying-glass']];
const icon=x=>/^ph-/.test(x.icon||'')?esc(x.icon.replace(/^ph-light\s*/,'')):(ICONS.find(([r])=>r.test(x.title||''))||[0,'ph-seal-check'])[1];
const show=(id,on)=>$(id).classList.toggle('hidden',!on);
const imgErr='onerror="this.onerror=null;this.src=FALLBACK_IMG"';
let D={},jur=[],slide=0,timer=null,lastFocus=null;

async function load(){
  let cached=null;try{cached=JSON.parse(localStorage.getItem(CACHE))}catch{}
  if(cached){D=cached;render()}
  try{
    const r=await fetch(DATA_URL,{cache:'no-cache'});if(!r.ok)throw new Error(r.status);
    const fresh=await r.json();
    if(JSON.stringify(fresh)!==JSON.stringify(cached)){D=fresh;try{localStorage.setItem(CACHE,JSON.stringify(fresh))}catch{}render()}
    show('error',false);
  }catch(e){console.warn('Data load failed',e);if(!cached)show('error',true)}
}

function render(){
  $('about-text').textContent=D.aboutMainText||D.about||'';
  KHIP.setPrompts(D.chatPrompts);
  const s=D.social||{};
  $('socials').innerHTML=[['linkedin','ph-linkedin-logo']].filter(([k])=>s[k]).map(([k,i])=>`<a href="${esc(s[k])}" target="_blank" rel="noopener noreferrer" aria-label="${k}" class="w-10 h-10 rounded-full border border-stone-200 text-stone-600 hover:text-brand-600 hover:border-brand-600 flex items-center justify-center transition"><i class="ph-light ${i} text-xl"></i></a>`).join('');
  carousel(D.carousel||[]);
  jur=D.jurisdictions||[];show('jurisdictions',jur.length);chips();pick(0);
  list('services',D.services,(x,i)=>`<div class="fu" style="--d:${(i%3)*.12}s"><div class="card h-full p-5 md:p-7 flex md:flex-col gap-4 md:gap-5 items-start"><div class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center flex-shrink-0"><i class="ph-light ${icon(x)} text-2xl md:text-3xl"></i></div><div class="flex flex-col flex-1"><h3 class="font-display text-2xl font-semibold text-ink">${esc(x.title)}</h3><p class="text-sm leading-relaxed mt-1.5 line-clamp-3">${esc(x.description)}</p><button data-act="service" data-i="${i}" class="mt-4 self-start text-sm border border-ink/30 hover:bg-ink hover:text-white px-6 py-1.5 rounded-full transition">More</button></div></div></div>`);
  list('news',D.news,x=>`<button data-act="news" data-id="${esc(x.id)}" class="card w-[17rem] sm:w-80 text-left overflow-hidden"><img loading="lazy" src="${img(x.image)}" ${imgErr} alt="" class="w-full h-40 object-cover"><div class="p-5">${x.date?`<span class="text-xs text-stone-500">${esc(x.date)}</span>`:''}<h3 class="font-display text-xl font-semibold text-ink leading-snug line-clamp-2 mt-0.5">${esc(x.title)}</h3><p class="text-sm mt-2 line-clamp-3">${esc(x.excerpt)}</p></div></button>`);
  $('news-count').textContent=`${(D.news||[]).length} articles`;
  list('team',D.employees,x=>`<div tabindex="0" class="card w-44 p-5 text-center"><img loading="lazy" src="${img(x.image)}" alt="${esc(x.name)}" onerror="this.onerror=null;this.src='https://placehold.co/200x200/e7e5e4/78716c?text=${encodeURIComponent((x.name||'?')[0])}'" class="w-24 h-24 rounded-full object-cover mx-auto mb-3"><h4 class="font-display text-lg font-semibold text-ink leading-tight">${esc(x.name)}</h4><span class="text-xs text-stone-500">${esc(x.position)}</span></div>`);
  list('testimonials',D.testimonials,(x,i)=>`<div class="tcard [grid-area:1/1] text-center transition-opacity duration-1000 ${i?'opacity-0 pointer-events-none':''}"><i class="ph-light ph-quotes text-4xl text-gold"></i><p class="font-display text-xl md:text-3xl leading-snug text-ink mt-3">${esc(x.text)}</p><h4 class="mt-5 font-medium text-ink">${esc(x.name)}</h4><span class="text-sm text-stone-500">${esc(x.role)}</span></div>`);
  ['news','team'].forEach(k=>auto($(k+'-list')));
  testi();observeFu();
  const h=location.hash.slice(1);
  if(h.startsWith('news-'))openNews(h.slice(5));
  else if(h&&!render.done&&$(h))setTimeout(()=>$(h).scrollIntoView(),80);
  render.done=1;
}
function list(id,items,fn){items=items||[];show(id,items.length);$(id+'-list').innerHTML=items.map(fn).join('')}

// Auto-moving parts stop while hovered, touched or focused, and resume 2.5s after
function watch(el){
  if(el._w)return;el._w=1;
  const hold=()=>{el._hold=true},free=()=>{el._wait=Date.now()+2500;el._hold=false};
  ['mouseenter','focusin','touchstart','pointerdown'].forEach(v=>el.addEventListener(v,hold,{passive:true}));
  ['mouseleave','focusout','touchend','pointerup'].forEach(v=>el.addEventListener(v,e=>{if(e.type==='pointerup'&&e.pointerType==='mouse')return;free()},{passive:true}));
}
const paused=el=>el._hold||Date.now()<(el._wait||0);
function auto(el,ms=3500){
  if(el._a)return;el._a=1;watch(el);
  setInterval(()=>{
    if(paused(el)||!el.firstElementChild)return;
    const step=el.firstElementChild.offsetWidth+16;
    if(el.scrollLeft+el.clientWidth>=el.scrollWidth-6)el.scrollTo({left:0,behavior:'smooth'});else el.scrollBy({left:step,behavior:'smooth'});
  },ms);
}
// Testimonials: one at a time, cross-fading
let ti=0;
function testi(){
  const n=(D.testimonials||[]).length;ti=0;
  $('t-dots').innerHTML=n>1?Array.from({length:n},(_,i)=>`<button data-act="tslide" data-i="${i}" aria-label="Testimonial ${i+1}" class="td h-1.5 rounded-full transition-all duration-500 ${i?'w-2 bg-stone-300':'w-7 bg-ink'}"></button>`).join(''):'';
  watch($('testimonials'));
  if(!testi.t)testi.t=setInterval(()=>{const m=(D.testimonials||[]).length;if(m>1&&!paused($('testimonials')))setT((ti+1)%m)},5500);
}
function setT(i){
  document.querySelectorAll('.tcard').forEach((c,k)=>{c.classList.toggle('opacity-0',k!==i);c.classList.toggle('pointer-events-none',k!==i)});
  document.querySelectorAll('.td').forEach((d,k)=>{d.classList.toggle('w-7',k===i);d.classList.toggle('bg-ink',k===i);d.classList.toggle('w-2',k!==i);d.classList.toggle('bg-stone-300',k!==i)});
  ti=i;
}

function carousel(slides){
  clearInterval(timer);slide=0;const c=$('carousel');
  c.parentElement.classList.toggle('hidden',!slides.length);
  c.innerHTML=slides.map((s,i)=>`<div class="slide absolute inset-0 ${i?'':'on'}"><img src="${img(s.image)}" ${imgErr} alt="" class="w-full h-full object-cover opacity-80"><div class="absolute inset-0 bg-gradient-to-t from-ink/90 via-ink/30 to-transparent p-6 md:p-12 flex flex-col justify-end text-white"><h2 class="font-display text-3xl md:text-5xl font-medium leading-tight max-w-2xl">${esc(s.title)}</h2><p class="text-sm md:text-base text-stone-200 mt-2 max-w-xl">${esc(s.subtitle)}</p></div></div>`).join('')
   +`<div class="absolute bottom-4 right-5 md:right-8 flex gap-2">${slides.map((_,i)=>`<button data-act="slide" data-i="${i}" aria-label="Slide ${i+1}" class="dot h-1.5 rounded-full bg-white transition-all duration-500 ${i?'w-2 opacity-50':'w-7'}"></button>`).join('')}</div>`;
  if(slides.length>1){const go=()=>{timer=setInterval(()=>setSlide((slide+1)%slides.length),5500)};go();c.onmouseenter=()=>clearInterval(timer);c.onmouseleave=()=>{clearInterval(timer);go()}}
}
function setSlide(i){
  const s=document.querySelectorAll('.slide'),d=document.querySelectorAll('.dot');if(!s[i])return;
  s[slide].classList.remove('on');d[slide].classList.replace('w-7','w-2');d[slide].classList.add('opacity-50');
  slide=i;s[i].classList.add('on');d[i].classList.replace('w-2','w-7');d[i].classList.remove('opacity-50');
}

function chips(){
  const q=$('jur-search').value.trim().toLowerCase();
  const m=jur.map((j,i)=>[j,i]).filter(([j])=>!q||(j.country||'').toLowerCase().includes(q));
  window.jm=m.map(x=>x[1]);$('jur-count').textContent=`${m.length} of ${jur.length} countries`;
  $('jur-chips').innerHTML=m.map(([j,i])=>`<button data-act="jur" data-i="${i}" id="chip-${i}" class="flex items-center gap-2 px-4 py-2 rounded-full text-sm flex-shrink-0 bg-white border border-stone-300 transition"><span class="text-base">${flag(j)}</span>${esc(j.country)}</button>`).join('')||'<p class="text-sm py-2">No matching country. Message us and we will check for you.</p>';
}
let jc=0;
function pick(i){
  const j=jur[i];if(!j){$('jur-card').innerHTML='';return}
  jc=i;
  document.querySelectorAll('[id^=chip-]').forEach(b=>{const on=b.id==='chip-'+i;b.classList.toggle('bg-ink',on);b.classList.toggle('text-white',on);b.classList.toggle('border-ink',on);b.classList.toggle('bg-white',!on)});
  const ch=$('chip-'+i),box=$('jur-chips');
  if(ch)box.scrollTo({left:ch.offsetLeft-(box.clientWidth-ch.offsetWidth)/2,behavior:'smooth'});
  const c=$('jur-card');c.style.transition='opacity .3s ease,transform .3s ease';c.style.opacity=0;c.style.transform='translateX(-24px)';
  setTimeout(()=>{
    c.innerHTML=`<div class="flex items-center gap-4"><span class="text-4xl">${flag(j)}</span><h3 class="font-display text-3xl font-semibold text-ink">${esc(j.country)}</h3></div><p class="mt-4 text-sm md:text-base leading-relaxed line-clamp-4 max-w-3xl">${esc(j.brief||'IP guidelines available upon inquiry.')}</p><div class="mt-6 text-center"><button data-act="jurmodal" data-i="${i}" class="text-sm bg-ink hover:bg-stone-800 text-white px-10 py-2.5 rounded-full transition">Process</button></div>`;
    c.style.transition='none';c.style.transform='translateX(24px)';void c.offsetWidth;
    c.style.transition='opacity .6s ease,transform .7s cubic-bezier(.16,1,.3,1)';c.style.opacity=1;c.style.transform='none';
  },300);
}
// Countries advance by themselves every 3 seconds
setInterval(()=>{
  const sec=$('jurisdictions'),m=window.jm||[];
  if(paused(sec)||m.length<2||$('jur-search').value||!$('modal').classList.contains('pointer-events-none'))return;
  pick(m[(m.indexOf(jc)+1)%m.length]);
},3000);

function openModal(html){
  lastFocus=document.activeElement;$('m-body').innerHTML=html;
  $('modal').classList.remove('opacity-0','pointer-events-none');$('sheet').classList.remove('closed');$('m-scroll').scrollTop=0;
  document.body.style.overflow='hidden';$('sheet').querySelector('button').focus({preventScroll:true});
}
function closeModal(){
  $('modal').classList.add('opacity-0','pointer-events-none');$('sheet').classList.add('closed');
  document.body.style.overflow='';if(location.hash.startsWith('#news-'))history.replaceState(null,'',location.pathname);
  lastFocus&&lastFocus.focus();
}
function openNews(id){
  const a=(D.news||[]).find(n=>String(n.id)===String(id));if(!a)return;
  history.replaceState(null,'','#news-'+a.id);
  openModal(`<h3 id="m-title" class="font-display text-3xl font-semibold text-ink pr-10 leading-tight">${esc(a.title)}</h3>${a.date?`<span class="text-xs text-stone-500">${esc(a.date)}</span>`:''}<img src="${img(a.image)}" ${imgErr} alt="" class="w-full h-52 md:h-72 rounded-2xl object-cover"><p class="leading-relaxed whitespace-pre-line">${esc(a.text||a.excerpt)}</p><button data-act="share" data-id="${esc(a.id)}" class="text-sm bg-stone-100 hover:bg-stone-200 px-4 py-2 rounded-full transition"><i class="ph-light ph-link"></i> Copy link</button>`);
}
function openService(i){
  const x=(D.services||[])[i];if(!x)return;
  openModal(`<div class="flex items-center gap-4 pr-10"><div class="w-14 h-14 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center flex-shrink-0"><i class="ph-light ${icon(x)} text-3xl"></i></div><h3 id="m-title" class="font-display text-3xl font-semibold text-ink leading-tight">${esc(x.title)}</h3></div><p class="leading-relaxed whitespace-pre-line">${esc(x.details||x.description)}</p><button data-act="inquire" data-q="${esc(x.title)}" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded-full text-sm transition"><i class="ph-light ph-whatsapp-logo"></i> Inquire about ${esc(x.title)}</button>`);
}
function openJur(i){
  const j=jur[i];if(!j)return;
  openModal(`<div class="flex items-center gap-4 pr-10"><span class="text-4xl">${flag(j)}</span><h3 id="m-title" class="font-display text-3xl font-semibold text-ink">${esc(j.country)}</h3></div><div class="bg-stone-50 p-5 rounded-2xl border border-stone-200"><h4 class="font-display text-lg font-semibold text-ink mb-1">Overview</h4><p class="text-sm leading-relaxed whitespace-pre-line">${esc(j.brief)}</p></div><div><h4 class="font-display text-lg font-semibold text-ink mb-1">Filing guidelines</h4><p class="text-sm leading-relaxed whitespace-pre-line">${esc(j.details||j.brief)}</p></div><button data-act="inquire" data-q="IP filings and legal procedures in ${esc(j.country)}" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded-full text-sm transition"><i class="ph-light ph-whatsapp-logo"></i> Inquire about ${esc(j.country)}</button>`);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const {act,i,id,q}=t.dataset;
  if(act==='close'){if(e.target===t||t.tagName==='BUTTON')closeModal()}
  else if(act==='jur')pick(+i);else if(act==='jurmodal')openJur(+i);else if(act==='news')openNews(id);
  else if(act==='slide')setSlide(+i);else if(act==='service')openService(+i);else if(act==='tslide')setT(+i);else if(act==='inquire')KHIP.wa(`Hello KHIP! I would like to inquire about ${q}.`);
  else if(act==='retry')load();
  else if(act==='share'){const u=location.origin+location.pathname+'#news-'+id;(navigator.share?navigator.share({url:u}):navigator.clipboard.writeText(u)).then(()=>t.textContent='Link copied').catch(()=>{})}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Tab'&&!$('modal').classList.contains('pointer-events-none')){
    const f=[...$('sheet').querySelectorAll('button')],a=document.activeElement;
    if(e.shiftKey&&a===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&a===f.at(-1)){e.preventDefault();f[0].focus()}
  }
});
$('jur-search').addEventListener('input',()=>{chips();const q=$('jur-search').value.trim().toLowerCase(),f=jur.findIndex(j=>(j.country||'').toLowerCase().includes(q));if(f>-1)pick(f)});
// Fade-up on scroll: sections, and individual .fu items
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.08});
const observeFu=()=>document.querySelectorAll('.fu:not(.in)').forEach(e=>io.observe(e));
document.querySelectorAll('main section:not(#about):not(#services)').forEach(x=>{x.classList.add('rv');io.observe(x)});
observeFu();
load();
</script>
