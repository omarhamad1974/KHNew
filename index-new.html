<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHIP - Intellectual Property & Legal Solutions</title>
<meta name="description" content="KHIP (Khaled Hamada Intellectual Property): patents, trademarks and translation across the Middle East.">
<meta property="og:title" content="KHIP Legal"><meta property="og:description" content="IP and legal services across the Middle East.">
<meta name="theme-color" content="#1d4ed8">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/7.2.3/css/flag-icons.min.css">
<script>tailwind.config={theme:{extend:{colors:{brand:{50:'#eff6ff',100:'#dbeafe',500:'#2563eb',600:'#1d4ed8',700:'#1e40af'}}}}}</script>
<style>
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
html{scroll-behavior:smooth;scroll-padding-top:70px}
:focus-visible{outline:2px solid #1d4ed8;outline-offset:2px}
.slide{transition:opacity .6s}.sheet{transition:transform .3s cubic-bezier(.16,1,.3,1)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body class="bg-gray-100 text-gray-900 antialiased font-sans pb-36">
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur shadow-sm border-b px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-2.5">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white font-black text-xl">KH</div>
    <span class="font-extrabold text-xl">KHIP Legal</span>
  </div>
  <div class="flex gap-3" id="socials"></div>
</header>

<main class="max-w-md mx-auto min-h-screen">
  <div id="error" class="hidden m-4 p-4 rounded-2xl bg-red-50 border border-red-200 text-sm text-red-800" role="alert">
    We couldn't load the latest content.
    <button data-act="retry" class="ml-2 font-bold underline">Try again</button>
  </div>

  <section class="p-4"><div id="carousel" class="relative h-52 sm:h-60 rounded-2xl overflow-hidden shadow-lg bg-gray-900" aria-roledescription="carousel"></div></section>

  <section id="about" class="px-5 py-2">
    <h2 class="text-xl font-extrabold mb-2"><i class="fas fa-info-circle text-brand-600"></i> About KHIP</h2>
    <p id="about-text" class="text-sm font-medium leading-relaxed text-gray-800"></p>
    <a href="about.html" class="mt-3 inline-block text-xs bg-brand-50 hover:bg-brand-100 text-brand-700 font-bold px-3.5 py-2 rounded-xl">Full firm profile</a>
  </section>

  <section id="jurisdictions" class="px-4 py-4 hidden">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-xl font-extrabold"><i class="fas fa-globe-africa text-brand-600"></i> Jurisdictions</h2>
      <span id="jur-count" class="text-xs text-brand-700 font-bold bg-brand-50 px-3 py-1 rounded-full"></span>
    </div>
    <input id="jur-search" type="search" placeholder="Search countries" aria-label="Search countries" class="w-full mb-3 px-4 py-2 text-sm rounded-xl border border-gray-200 bg-white">
    <div id="jur-chips" class="flex gap-2.5 overflow-x-auto no-scrollbar pb-2 mb-2"></div>
    <div id="jur-card" class="bg-white rounded-2xl p-5 border border-gray-200 shadow-sm space-y-3"></div>
  </section>

  <section id="services" class="px-4 py-4 hidden">
    <h2 class="text-xl font-extrabold mb-3"><i class="fas fa-balance-scale text-brand-600"></i> Practice areas</h2>
    <div id="services-list" class="grid grid-cols-2 gap-3"></div>
  </section>

  <section id="products" class="px-4 py-3 hidden">
    <h2 class="text-xl font-extrabold mb-3"><i class="fas fa-file-contract text-brand-600"></i> Services & search reports</h2>
    <div id="products-list" class="flex gap-3 overflow-x-auto no-scrollbar pb-2"></div>
  </section>

  <section id="news" class="px-4 py-4 hidden">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-xl font-extrabold"><i class="far fa-newspaper text-brand-600"></i> Latest IP updates</h2>
      <span id="news-count" class="text-xs font-bold bg-gray-200 px-2.5 py-1 rounded-full"></span>
    </div>
    <div id="news-list" class="space-y-3"></div>
  </section>

  <section id="team" class="px-4 py-4 hidden">
    <h2 class="text-xl font-extrabold mb-3"><i class="fas fa-users text-brand-600"></i> Our team</h2>
    <div id="team-list" class="flex gap-3 overflow-x-auto no-scrollbar pb-2"></div>
  </section>

  <section id="testimonials" class="px-4 py-4 hidden">
    <h2 class="text-xl font-extrabold mb-3"><i class="fas fa-quote-left text-brand-600"></i> Client endorsements</h2>
    <div id="testimonials-list" class="flex gap-3 overflow-x-auto no-scrollbar pb-2"></div>
  </section>
</main>

<div id="modal" class="fixed inset-0 bg-black/70 z-50 flex items-end justify-center opacity-0 pointer-events-none transition-opacity" data-act="close" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div id="sheet" class="sheet bg-white w-full max-w-md rounded-t-3xl max-h-[90vh] overflow-y-auto p-5 relative translate-y-full" onclick="event.stopPropagation()">
    <button data-act="close" aria-label="Close" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200"><i class="fas fa-times"></i></button>
    <div id="m-body" class="space-y-3"></div>
  </div>
</div>

<div class="fixed bottom-0 inset-x-0 z-40 max-w-md mx-auto bg-white/95 backdrop-blur border-t shadow-2xl">
  <form id="wa-form" class="p-2 bg-emerald-50/70 flex gap-2">
    <input id="wa-input" aria-label="Message KHIP on WhatsApp" placeholder="Message KHIP on WhatsApp" class="flex-1 px-3.5 py-1.5 text-xs bg-white rounded-full border border-emerald-300">
    <button class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-full text-xs font-bold">Send</button>
  </form>
  <nav class="grid grid-cols-5 py-2 text-center text-[10px] font-bold text-gray-600" id="nav">
    <button data-go="jurisdictions"><i class="fas fa-globe-africa text-base block"></i>Jurisdictions</button>
    <button data-go="services"><i class="fas fa-balance-scale text-base block"></i>Services</button>
    <button data-go="top" class="text-brand-600"><i class="fas fa-home text-base block"></i>Home</button>
    <button data-go="news"><i class="far fa-newspaper text-base block"></i>News</button>
    <button data-go="about"><i class="fas fa-info-circle text-base block"></i>About</button>
  </nav>
</div>

<script>
const PHONE="201006552255", DATA_URL="./app-data.json", CACHE="khip-data-v2";
const CODES={egypt:'eg',uae:'ae','united arab emirates':'ae','saudi arabia':'sa',jordan:'jo',kuwait:'kw',qatar:'qa',bahrain:'bh',oman:'om',morocco:'ma',tunisia:'tn',algeria:'dz',libya:'ly',lebanon:'lb',iraq:'iq',syria:'sy',yemen:'ye',sudan:'sd',palestine:'ps',turkey:'tr'};
const FALLBACK_IMG="https://placehold.co/600x400?text=KHIP";
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=u=>/^(https?:\/\/|\.\/|\/)/.test(u||'')?esc(u):FALLBACK_IMG;
const flag=j=>{const c=String(j.code||CODES[(j.country||'').toLowerCase()]||'').toLowerCase();return /^[a-z]{2}$/.test(c)?`<span class="fi fi-${c} rounded-sm shadow-sm" role="img" aria-label="${esc(j.country)} flag"></span>`:'<i class="fas fa-globe-africa text-brand-600"></i>'};
const wa=t=>window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(t)}`,'_blank','noopener');
const show=(id,on)=>$(id).classList.toggle('hidden',!on);
const imgErr='onerror="this.onerror=null;this.src=FALLBACK_IMG"';
let D={},jur=[],slide=0,timer=null,lastFocus=null;

async function load(){
  let cached=null;
  try{cached=JSON.parse(localStorage.getItem(CACHE))}catch{}
  if(cached){D=cached;render()}
  try{
    const r=await fetch(DATA_URL,{cache:'no-cache'});
    if(!r.ok)throw new Error(r.status);
    const fresh=await r.json();
    if(JSON.stringify(fresh)!==JSON.stringify(cached)){
      D=fresh;try{localStorage.setItem(CACHE,JSON.stringify(fresh))}catch{}
      render();
    }
    show('error',false);
  }catch(e){console.warn('Data load failed',e);if(!cached)show('error',true)}
}

function render(){
  $('about-text').textContent=D.aboutMainText||D.about||'';
  const s=D.social||{};
  $('socials').innerHTML=[['linkedin','fa-linkedin-in','bg-blue-50 text-blue-600'],['youtube','fa-youtube','bg-red-50 text-red-600']]
    .filter(([k])=>s[k]).map(([k,i,c])=>`<a href="${esc(s[k])}" target="_blank" rel="noopener noreferrer" aria-label="${k}" class="w-9 h-9 rounded-full ${c} flex items-center justify-center"><i class="fab ${i}"></i></a>`).join('');
  carousel(D.carousel||[]);
  jur=D.jurisdictions||[];show('jurisdictions',jur.length);chips();pick(0);
  list('services',D.services,x=>`<div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm text-center"><div class="w-12 h-12 mx-auto rounded-xl bg-blue-50 text-brand-600 flex items-center justify-center text-2xl mb-2.5"><i class="${/^[\w\- ]+$/.test(x.icon||'')?esc(x.icon):'fas fa-star'}"></i></div><h3 class="font-bold">${esc(x.title)}</h3><p class="text-xs text-gray-700 mt-1 line-clamp-4">${esc(x.description)}</p></div>`);
  list('products',D.products,x=>`<div class="min-w-[170px] max-w-[170px] bg-white rounded-2xl border border-gray-200 shadow-sm p-3.5 flex flex-col"><img loading="lazy" src="${img(x.image)}" ${imgErr} alt="" class="w-full h-28 object-cover rounded-xl mb-2"><span class="text-[10px] text-gray-600 font-bold">${esc(x.category)}</span><h4 class="text-sm font-bold line-clamp-1">${esc(x.title)}</h4><p class="text-brand-600 font-extrabold text-sm">${esc(x.price||'Inquire')}</p><button data-act="inquire" data-q="${esc(x.title)}" class="mt-2.5 text-xs bg-gray-100 hover:bg-brand-50 font-bold py-2 rounded-xl">Inquire</button></div>`);
  list('news',D.news,x=>`<button data-act="news" data-id="${esc(x.id)}" class="w-full text-left bg-white p-3.5 rounded-2xl border border-gray-200 shadow-sm flex gap-3.5"><img loading="lazy" src="${img(x.image)}" ${imgErr} alt="" class="w-[88px] h-[88px] rounded-xl object-cover flex-shrink-0"><div class="min-w-0"><h3 class="font-extrabold line-clamp-1">${esc(x.title)}</h3>${x.date?`<span class="text-[11px] text-gray-500">${esc(x.date)}</span>`:''}<p class="text-xs text-gray-700 mt-1 line-clamp-2">${esc(x.excerpt)}</p></div></button>`);
  $('news-count').textContent=`${(D.news||[]).length} articles`;
  list('team',D.employees,x=>`<div class="min-w-[130px] max-w-[130px] bg-white rounded-2xl border border-gray-200 shadow-sm p-3 text-center"><img loading="lazy" src="${img(x.image)}" alt="${esc(x.name)}" onerror="this.onerror=null;this.src='https://placehold.co/200x200?text=${encodeURIComponent((x.name||'?')[0])}'" class="w-20 h-20 rounded-full object-cover mx-auto mb-2"><h4 class="text-xs font-extrabold">${esc(x.name)}</h4><span class="text-[10px] text-brand-700 font-bold">${esc(x.position)}</span></div>`);
  list('testimonials',D.testimonials,x=>`<div class="min-w-[230px] max-w-[230px] bg-white rounded-2xl border border-gray-200 shadow-sm p-4 flex flex-col justify-between"><p class="text-xs italic line-clamp-4">“${esc(x.text)}”</p><div class="mt-3 pt-2 border-t"><h4 class="text-xs font-extrabold">${esc(x.name)}</h4><span class="text-[10px] text-brand-700 font-bold">${esc(x.role)}</span></div></div>`);
  if(location.hash.startsWith('#news-'))openNews(location.hash.slice(6));
}
function list(id,items,fn){items=items||[];show(id,items.length);$(id+'-list').innerHTML=items.map(fn).join('')}

function carousel(slides){
  clearInterval(timer);slide=0;const c=$('carousel');
  c.parentElement.classList.toggle('hidden',!slides.length);
  c.innerHTML=slides.map((s,i)=>`<div class="slide absolute inset-0 ${i?'opacity-0':''}"><img src="${img(s.image)}" ${imgErr} alt="" class="w-full h-full object-cover opacity-80"><div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-5 flex flex-col justify-end text-white"><span class="text-xs font-extrabold text-brand-600 bg-white/95 px-2.5 py-0.5 rounded-md w-max mb-1.5">${esc(s.tag||'Featured')}</span><h2 class="text-2xl font-black leading-tight">${esc(s.title)}</h2><p class="text-xs text-gray-200 mt-1 line-clamp-1">${esc(s.subtitle)}</p></div></div>`).join('')
   +`<div class="absolute bottom-3 right-4 flex gap-1.5">${slides.map((_,i)=>`<button data-act="slide" data-i="${i}" aria-label="Slide ${i+1}" class="dot h-2 rounded-full bg-white ${i?'w-2 opacity-50':'w-5'}"></button>`).join('')}</div>`;
  if(slides.length>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
    const go=()=>{timer=setInterval(()=>setSlide((slide+1)%slides.length),5000)};
    go();c.onmouseenter=c.ontouchstart=()=>clearInterval(timer);c.onmouseleave=c.ontouchend=()=>{clearInterval(timer);go()};
  }
}
function setSlide(i){
  const s=document.querySelectorAll('.slide'),d=document.querySelectorAll('.dot');
  if(!s[i])return;
  s[slide].classList.add('opacity-0');d[slide].classList.replace('w-5','w-2');d[slide].classList.add('opacity-50');
  slide=i;s[i].classList.remove('opacity-0');d[i].classList.replace('w-2','w-5');d[i].classList.remove('opacity-50');
}

function chips(){
  const q=$('jur-search').value.trim().toLowerCase();
  const m=jur.map((j,i)=>[j,i]).filter(([j])=>!q||(j.country||'').toLowerCase().includes(q));
  $('jur-count').textContent=`${m.length} of ${jur.length}`;
  $('jur-chips').innerHTML=m.map(([j,i])=>`<button data-act="jur" data-i="${i}" id="chip-${i}" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold flex-shrink-0 bg-white border border-gray-200"><span class="text-base">${flag(j)}</span>${esc(j.country)}</button>`).join('')||'<p class="text-xs text-gray-600 py-2">No matching country. Message us and we will check for you.</p>';
}
function pick(i){
  const j=jur[i];if(!j){$('jur-card').innerHTML='';return}
  document.querySelectorAll('[id^=chip-]').forEach(b=>{const on=b.id==='chip-'+i;b.classList.toggle('bg-brand-600',on);b.classList.toggle('text-white',on);b.classList.toggle('bg-white',!on)});
  $('jur-card').dataset.i=i;
  $('jur-card').innerHTML=`<div class="flex items-center gap-3"><span class="text-3xl">${flag(j)}</span><h3 class="font-extrabold text-base">${esc(j.country)}</h3></div><p class="text-xs text-gray-800 leading-relaxed line-clamp-3 bg-gray-50 p-3 rounded-xl border">${esc(j.brief||'IP guidelines available upon inquiry.')}</p><div class="pt-2 flex items-center justify-between border-t"><button data-act="jurmodal" data-i="${i}" class="text-xs bg-brand-50 hover:bg-brand-100 text-brand-700 font-extrabold px-3.5 py-2 rounded-xl">See filing info</button><button data-act="inquire" data-q="IP filings and legal procedures in ${esc(j.country)}" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl"><i class="fab fa-whatsapp"></i> Inquire</button></div>`;
}

function openModal(html){
  lastFocus=document.activeElement;
  $('m-body').innerHTML=html;
  $('modal').classList.remove('opacity-0','pointer-events-none');$('sheet').classList.remove('translate-y-full');
  document.body.style.overflow='hidden';$('sheet').querySelector('button').focus();
}
function closeModal(){
  $('modal').classList.add('opacity-0','pointer-events-none');$('sheet').classList.add('translate-y-full');
  document.body.style.overflow='';if(location.hash.startsWith('#news-'))history.replaceState(null,'',location.pathname);
  lastFocus&&lastFocus.focus();
}
function openNews(id){
  const a=(D.news||[]).find(n=>String(n.id)===String(id));if(!a)return;
  history.replaceState(null,'','#news-'+a.id);
  openModal(`<h3 id="m-title" class="text-xl font-extrabold pr-10 leading-snug">${esc(a.title)}</h3>${a.date?`<span class="text-xs text-gray-500">${esc(a.date)}</span>`:''}<img src="${img(a.image)}" ${imgErr} alt="" class="w-full h-44 rounded-2xl object-cover"><p class="text-sm leading-relaxed whitespace-pre-line">${esc(a.text||a.excerpt)}</p><button data-act="share" data-id="${esc(a.id)}" class="text-xs bg-gray-100 font-bold px-3.5 py-2 rounded-xl"><i class="fas fa-link"></i> Copy link</button>`);
}
function openJur(i){
  const j=jur[i];if(!j)return;
  openModal(`<div class="flex items-center gap-3 pr-10"><span class="text-4xl">${flag(j)}</span><h3 id="m-title" class="text-xl font-extrabold">${esc(j.country)}</h3></div><div class="bg-gray-50 p-4 rounded-2xl border"><h4 class="text-xs font-bold mb-1">Overview</h4><p class="text-xs leading-relaxed whitespace-pre-line">${esc(j.brief)}</p></div><div><h4 class="text-xs font-bold mb-1">Filing guidelines</h4><p class="text-xs leading-relaxed whitespace-pre-line">${esc(j.details||j.brief)}</p></div><button data-act="inquire" data-q="IP filings and legal procedures in ${esc(j.country)}" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs"><i class="fab fa-whatsapp"></i> Inquire about ${esc(j.country)}</button>`);
}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){g.dataset.go==='top'?scrollTo({top:0}):$(g.dataset.go)?.scrollIntoView();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const {act,i,id,q}=t.dataset;
  if(act==='close'){if(e.target===t||t.tagName==='BUTTON')closeModal()}
  else if(act==='jur')pick(+i);
  else if(act==='jurmodal')openJur(+i);
  else if(act==='news')openNews(id);
  else if(act==='slide')setSlide(+i);
  else if(act==='inquire')wa(`Hello KHIP! I would like to inquire about ${q}.`);
  else if(act==='retry')load();
  else if(act==='share'){const u=location.origin+location.pathname+'#news-'+id;(navigator.share?navigator.share({url:u}):navigator.clipboard.writeText(u)).then(()=>t.textContent='Link copied').catch(()=>{})}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Tab'&&!$('modal').classList.contains('pointer-events-none')){
    const f=[...$('sheet').querySelectorAll('button')];const a=document.activeElement;
    if(e.shiftKey&&a===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&a===f.at(-1)){e.preventDefault();f[0].focus()}
  }
});
$('jur-search').addEventListener('input',()=>{chips();const first=jur.findIndex(j=>(j.country||'').toLowerCase().includes($('jur-search').value.trim().toLowerCase()));if(first>-1)pick(first)});
$('wa-form').addEventListener('submit',e=>{e.preventDefault();const v=$('wa-input').value.trim();if(v){wa(v);$('wa-input').value=''}});
load();
</script>
</body>
</html>
